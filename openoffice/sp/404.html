<script>
    $(function(){
		$('.ttl_area').each(function(){
			if($(this).next().css("display") == "flex"){
				$(this).children('.area_txt').css("background","url(/sp/common/img/minus.gif) no-repeat top right / contain");
			}else{
				$(this).children('.area_txt').css("background","url(/sp/common/img/plus.gif) no-repeat top right / contain");
			}	
		});
	
		$('.ttl_area').click(function(){
			if($(this).next().css("display") == "flex"){
				$(this).next().slideUp();
				$(this).children('.area_txt').css("background","url(/sp/common/img/plus.gif) no-repeat top right / contain");
			}else{
				$(this).next().slideDown();
				$(this).children('.area_txt').css("background","url(/sp/common/img/minus.gif) no-repeat top right / contain");
			}
		});
    });
